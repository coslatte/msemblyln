[package]
name = "msemblyln"
version = "0.1.0"
description = "Audio + image to MP4 video"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[[bin]]
name = "msemblyln"
path = "src/main.rs"

[[bin]]
name = "msemblyln-cli"
path = "src/bin/msemblyln-cli.rs"
